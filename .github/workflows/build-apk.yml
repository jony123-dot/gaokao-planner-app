name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - uses: android-actions/setup-android@v3

      # 关键补丁：让 appUrl 带上斜杠
      - name: Patch Capacitor Bridge.java
        run: |
          sed -i 's/webView\.loadUrl(appUrl);/webView.loadUrl(appUrl + "\/");/g' \
            node_modules/@capacitor/android/capacitor/src/main/java/com/getcapacitor/Bridge.java
          echo "Bridge.java patched"

      - run: npx cap copy android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: android/build.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: UniPlanner-APK
          path: "**/*.apk"
