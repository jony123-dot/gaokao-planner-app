name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install 2>&1
      - uses: android-actions/setup-android@v3
      - run: npx cap copy android 2>&1
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log
      - name: Locate and upload APK
        run: |
          echo "Searching for APK..."
          find . -name "*.apk" -type f 2>&1
          find . -name "*.apk" -type f -exec cp {} apk-output.apk \; 2>&1 || true
          ls -la *.apk 2>&1 || echo "No APK found at root"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UniPlanner-APK
          path: "*.apk"
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: android/build.log
