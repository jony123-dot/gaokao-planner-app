name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm install 2>&1

      - name: Sync web assets to Android
        run: npx cap copy android 2>&1

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          export ANDROID_HOME=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "Java: $(java -version 2>&1)"
          ls -la $ANDROID_HOME/platforms/ 2>/dev/null || echo "No platforms dir at ANDROID_HOME"
          ls -la $ANDROID_SDK_ROOT/platforms/ 2>/dev/null || echo "No platforms dir at ANDROID_SDK_ROOT"
          ./gradlew assembleDebug --no-daemon 2>&1 || ./gradlew assembleDebug --no-daemon --info 2>&1 | tail -100

      - name: Upload APK (if built)
        uses: actions/upload-artifact@v4
        with:
          name: UniPlanner-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
        continue-on-error: true

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: android/app/build/reports/
        continue-on-error: true
